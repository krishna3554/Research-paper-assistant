services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: papermind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind_password
      POSTGRES_DB: papermind
    ports:
      - "5432:5432"
    volumes:
      - papermind_postgres_data:/var/lib/postgresql/data
  
  minio:
    image: minio/minio:latest
    container_name: papermind_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: papermind
      MINIO_ROOT_PASSWORD: papermind_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - papermind_minio_data:/data

volumes:
  papermind_postgres_data:
  papermind_minio_data:

      

